name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "api/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "api/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: make check
