name: server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fd
          POSTGRES_PASSWORD: fd
          POSTGRES_DB: first_domino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fd -d first_domino"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FD_DATABASE_URL: postgresql+asyncpg://fd:fd@localhost:5432/first_domino
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: make check
