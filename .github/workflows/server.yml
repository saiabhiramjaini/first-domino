name: server

# check -> publish -> deploy. A pull request runs check only. A push to main also builds the
# image, pushes it to Docker Hub and rolls it out on the EC2 server. Publish and deploy are
# skipped until the repository variables in docs/DEPLOY.md are set.

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: server

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/api-first-domino

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fd
          POSTGRES_PASSWORD: fd
          POSTGRES_DB: first_domino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fd -d first_domino"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FD_DATABASE_URL: postgresql+asyncpg://fd:fd@localhost:5432/first_domino
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: make check

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      SERVER_ENV: ${{ secrets.SERVER_ENV }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy the compose files and settings
        run: |
          remote="$EC2_USER@$EC2_HOST"
          ssh -i ~/.ssh/ec2 "$remote" 'mkdir -p ~/first-domino'
          scp -i ~/.ssh/ec2 deploy/compose.yaml "$remote:first-domino/"
          # Committed settings first, then the secrets (later values win), then the image.
          { cat deploy/config.env; printf '\n%s\n' "$SERVER_ENV"; printf 'IMAGE=%s\nIMAGE_TAG=%s\n' "$IMAGE" "$GITHUB_SHA"; } \
            | ssh -i ~/.ssh/ec2 "$remote" 'umask 077 && cat > ~/first-domino/.env'
      - name: Roll out the new image
        run: |
          ssh -i ~/.ssh/ec2 "$EC2_USER@$EC2_HOST" \
            'cd ~/first-domino && docker compose pull && docker compose up -d --remove-orphans --wait && docker image prune -f'
      - name: Check the live API
        run: |
          API_DOMAIN=$(sed -n 's/^API_DOMAIN=//p' deploy/config.env)
          for _ in $(seq 1 30); do
            curl -fsS "https://$API_DOMAIN/health" && exit 0
            sleep 5
          done
          echo "the API did not answer at https://$API_DOMAIN/health" >&2
          exit 1
