default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: backend-ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix "${@#backend/}"' --
        language: system
        files: ^backend/.*\.py$
      - id: backend-ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd backend && uv run ruff format "${@#backend/}"' --
        language: system
        files: ^backend/.*\.py$
      - id: frontend-prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && bunx prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs|json|css|md)$
        exclude: ^frontend/src/api/generated/
      - id: commit-message
        name: 'commit message is "type: subject"'
        entry: '^(feat|fix|docs|style|refactor|test|chore|perf): .+'
        language: pygrep
        args: [--negate]
        stages: [commit-msg]
