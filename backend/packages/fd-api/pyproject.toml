[project]
name = "fd-api"
version = "0.1.0"
description = "FastAPI control plane: auth, run ingest, the replay job queue, diagnoses, causes and the benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fd-shared",
    "fd-database",
    "fd-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
