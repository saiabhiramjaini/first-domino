[project]
name = "first-domino"
version = "0.1.0"
description = "First Domino Python SDK: record agent runs and replay them on command with a self-hosted worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
openai = [
    "openai>=1.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
