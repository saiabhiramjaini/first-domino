[project]
name = "first-domino-workspace"
version = "0.1.0"
description = "First Domino backend workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fd-shared",
    "fd-database",
    "fd-engine",
    "fd-api",
    "first-domino",
    "fd-demo-agent",
    "fd-scripts",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "datamodel-code-generator>=0.26",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fd-shared = { workspace = true }
fd-database = { workspace = true }
fd-engine = { workspace = true }
fd-api = { workspace = true }
first-domino = { workspace = true }
fd-demo-agent = { workspace = true }
fd-scripts = { workspace = true }

[tool.ruff]
extend = "ruff.toml"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages"]
exclude = ["**/__pycache__", "**/.venv", "packages/first-domino/src/first_domino/_generated"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib", "-q"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
