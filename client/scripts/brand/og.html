<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>First Domino OG image</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 72px 80px;
        background: #0a0a0b;
        font-family: Inter, system-ui, sans-serif;
        color: #ededef;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0;
        font-size: 68px;
        line-height: 1.04;
        font-weight: 600;
        letter-spacing: -0.035em;
        max-width: 900px;
      }
      p {
        margin: 20px 0 0;
        font-size: 26px;
        line-height: 1.35;
        color: #9a9aa3;
        max-width: 1040px;
      }
      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 14px;
        color: #6b6b74;
      }
      .tile {
        width: 22px;
        height: 56px;
        border-radius: 5px;
        background: #ededef;
      }
      .ok .tile {
        background: #26262b;
      }
      .hit .tile {
        background: #8b7cff;
        transform: rotate(12deg);
        transform-origin: bottom right;
      }
      .hit {
        color: #8b7cff;
        font-weight: 500;
      }
      .claim {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .claim b {
        font-size: 22px;
        font-weight: 600;
      }
      .claim span {
        font-size: 20px;
        color: #9a9aa3;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true">
          <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="#18181B" stroke="#2E2E34" />
          <rect x="5.5" y="6" width="5" height="15" rx="1.2" fill="#EDEDEF" opacity=".35" />
          <rect x="13.5" y="6" width="5" height="15" rx="1.2" fill="#8B7CFF" />
          <rect x="21.5" y="6" width="5" height="15" rx="1.2" fill="#EDEDEF" />
          <path d="M16 22.5l3.5 4.5h-7z" fill="#8B7CFF" />
        </svg>
        First Domino
      </div>
      <div>
        <h1>Find the step where your AI agent’s run was lost.</h1>
        <p>Replays from save points, finds the first doomed step, and proves it with a fix.</p>
      </div>
      <div class="foot">
        <div class="row">
          <div class="step ok">
            <div class="tile"></div>
            1
          </div>
          <div class="step ok">
            <div class="tile"></div>
            2
          </div>
          <div class="step ok">
            <div class="tile"></div>
            3
          </div>
          <div class="step hit">
            <div class="tile"></div>
            4
          </div>
          <div class="step">
            <div class="tile"></div>
            5
          </div>
          <div class="step">
            <div class="tile"></div>
            6
          </div>
          <div class="step">
            <div class="tile"></div>
            7
          </div>
          <div class="step">
            <div class="tile"></div>
            8
          </div>
        </div>
        <div class="claim"><b>Step 4 is the first domino.</b><span>Proven, not guessed.</span></div>
      </div>
    </div>
  </body>
</html>
