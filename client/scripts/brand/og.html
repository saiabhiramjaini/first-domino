<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>First Domino OG image</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      .og {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 72px 80px;
        background: #0a0a0b;
        font-family: Inter, system-ui, sans-serif;
        color: #ededef;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0;
        font-size: 68px;
        line-height: 1.04;
        font-weight: 600;
        letter-spacing: -0.035em;
        max-width: 900px;
      }
      p {
        margin: 20px 0 0;
        font-size: 26px;
        line-height: 1.35;
        color: #9a9aa3;
        max-width: 1040px;
      }
      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 14px;
        color: #6b6b74;
      }
      .tile {
        width: 22px;
        height: 56px;
        border-radius: 5px;
        background: #ededef;
      }
      .ok .tile {
        background: #26262b;
      }
      .hit .slot {
        position: relative;
        width: 22px;
        height: 56px;
      }
      .hit .slot::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px dashed rgba(139, 124, 255, 0.7);
        border-radius: 5px;
        box-sizing: border-box;
      }
      .hit .tile {
        position: absolute;
        inset: 0;
        background: #8b7cff;
        transform: rotate(-34deg);
        transform-origin: bottom left;
      }
      .hit {
        color: #8b7cff;
        font-weight: 500;
      }
      .claim {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .claim b {
        font-size: 22px;
        font-weight: 600;
      }
      .claim span {
        font-size: 20px;
        color: #9a9aa3;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="60" height="60" aria-hidden="true">
          <rect
            x="17.3"
            y="7.3"
            width="7.4"
            height="18.4"
            rx="2"
            fill="none"
            stroke="#8B7CFF"
            stroke-width="1.6"
            stroke-dasharray="2.2 1.8"
            opacity=".75"
          />
          <rect
            x="16.5"
            y="6.5"
            width="9"
            height="20"
            rx="2.6"
            fill="#8B7CFF"
            transform="rotate(-34 16.5 26.5)"
          />
        </svg>
        First Domino
      </div>
      <div>
        <h1>Find the step where your AI agent’s run was lost.</h1>
        <p>Replays from save points, finds the first doomed step, and proves it with a fix.</p>
      </div>
      <div class="foot">
        <div class="row">
          <div class="step ok">
            <div class="tile"></div>
            1
          </div>
          <div class="step ok">
            <div class="tile"></div>
            2
          </div>
          <div class="step ok">
            <div class="tile"></div>
            3
          </div>
          <div class="step hit">
            <div class="slot"><div class="tile"></div></div>
            4
          </div>
          <div class="step">
            <div class="tile"></div>
            5
          </div>
          <div class="step">
            <div class="tile"></div>
            6
          </div>
          <div class="step">
            <div class="tile"></div>
            7
          </div>
          <div class="step">
            <div class="tile"></div>
            8
          </div>
        </div>
        <div class="claim"><b>Step 4 is the first domino.</b><span>Proven, not guessed.</span></div>
      </div>
    </div>
  </body>
</html>
