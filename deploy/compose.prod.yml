# First Domino on one host: Postgres, the API, the web app, the demo customer's replay worker
# and Caddy for HTTPS. Secrets come only from deploy/.env on the host (see .env.example).
#   docker compose -f deploy/compose.prod.yml up -d --build

name: first-domino-prod

x-backend: &backend
  build:
    context: ../backend
  image: first-domino-backend:prod
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: first_domino
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fd -d first_domino"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FD_DATABASE_URL: postgresql+asyncpg://fd:${POSTGRES_PASSWORD}@postgres:5432/first_domino
      FD_API_WEB_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET in deploy/.env}
      FD_API_CORS_ORIGINS: '["https://${FD_DOMAIN:?set FD_DOMAIN in deploy/.env}"]'
      FD_API_LOG_JSON: "true"
      FD_ENGINE_STRONG_MODEL: ${FD_ENGINE_STRONG_MODEL:?set FD_ENGINE_STRONG_MODEL in deploy/.env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in deploy/.env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../frontend
      args:
        APP_ENV: prod
        NEXT_PUBLIC_APP_URL: https://${FD_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${FD_DOMAIN}
    image: first-domino-web:prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: prod
      AUTH_URL: https://${FD_DOMAIN}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID in deploy/.env}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET in deploy/.env}
      API_JWT_SECRET: ${API_JWT_SECRET}
      LOG_LEVEL: info

  # The demo customer's replay worker. It reaches the API through the public URL, exactly as
  # a customer's worker would. Compose checks variables even for services that are off, so its
  # key is optional here; start it with `--profile worker` once `seed_demo` printed the key.
  worker:
    <<: *backend
    command: ["python", "-m", "fd_demo_agent.worker"]
    profiles: ["worker"]
    depends_on:
      caddy:
        condition: service_started
    environment:
      FIRST_DOMINO_BASE_URL: https://${FD_DOMAIN}
      FIRST_DOMINO_API_KEY: ${FIRST_DOMINO_API_KEY:-}
      FD_DEMO_AGENT_MODEL: ${FD_DEMO_AGENT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      FD_DOMAIN: ${FD_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
