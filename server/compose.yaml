name: first-domino

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fd}
      POSTGRES_DB: ${POSTGRES_DB:-first_domino}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fd} -d ${POSTGRES_DB:-first_domino}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
