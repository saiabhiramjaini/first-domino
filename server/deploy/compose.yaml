# Production stack on the EC2 server: the API, the demo customer's replay worker, and Caddy
# for HTTPS. The deploy workflow copies this file and the Caddyfile to ~/first-domino and
# writes ~/first-domino/.env from the SERVER_ENV secret (see deploy/.env.example).
name: first-domino

x-server-image: &server-image "${IMAGE:?set IMAGE in .env}:${IMAGE_TAG:-latest}"

services:
  api:
    image: *server-image
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # The demo customer. Off until COMPOSE_PROFILES=demo and FIRST_DOMINO_API_KEY are set.
  worker:
    image: *server-image
    command: ["python", "-m", "fd_demo_agent.worker"]
    env_file: .env
    environment:
      FIRST_DOMINO_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: [demo]

  caddy:
    image: caddy:2.10-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
