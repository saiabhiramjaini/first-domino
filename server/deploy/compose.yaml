# Production stack on the EC2 server: the API and the demo customer's replay worker. nginx on
# the host serves HTTPS and forwards to the API on 127.0.0.1:8000 (see nginx.conf). The deploy
# workflow copies this file to ~/first-domino and writes ~/first-domino/.env from config.env
# plus the SERVER_ENV secret (see .env.example).
name: first-domino

x-server-image: &server-image "${IMAGE:?set IMAGE in .env}:${IMAGE_TAG:-latest}"

services:
  api:
    image: *server-image
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # The demo customer. Off until COMPOSE_PROFILES=demo and FIRST_DOMINO_API_KEY are set.
  worker:
    image: *server-image
    command: ["python", "-m", "fd_demo_agent.worker"]
    env_file: .env
    environment:
      FIRST_DOMINO_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: [demo]
