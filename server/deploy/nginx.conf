# nginx site for the API. Copy to /etc/nginx/sites-available/api-first-domino on the server;
# `certbot --nginx` then adds the HTTPS server block. The API listens on 127.0.0.1:8000.
server {
    listen 80;
    server_name api-first-domino.abhiramtech.in;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
