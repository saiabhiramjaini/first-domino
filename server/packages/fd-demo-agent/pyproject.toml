[project]
name = "fd-demo-agent"
version = "0.1.0"
description = "The demo customer: a booking agent with mock tools, a success check and a replay worker, using only the public SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "first-domino[openai]",
    "openai>=1.55",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
