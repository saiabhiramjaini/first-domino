[project]
name = "fd-scripts"
version = "0.1.0"
description = "Command-line tools: OpenAPI export, labelled dataset builder and the benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fd-shared",
    "fd-database",
    "fd-engine",
    "fd-api",
    "fd-demo-agent",
    "click>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
