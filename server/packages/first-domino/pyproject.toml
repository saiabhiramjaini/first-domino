[project]
name = "first-domino"
version = "0.1.0"
description = "Find the step where a failed AI agent run went wrong, and prove it with a replay."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaini Sai Abhiram" }]
requires-python = ">=3.12"
keywords = ["ai", "agents", "llm", "debugging", "observability", "evals", "openai", "anthropic", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
openai = [
    "openai>=1.55",
]
agents = [
    "openai-agents>=0.25.0",
]

[project.urls]
Homepage = "https://first-domino.abhiramtech.in"
Repository = "https://github.com/saiabhiramjaini/first-domino"
Documentation = "https://github.com/saiabhiramjaini/first-domino/tree/main/server/packages/first-domino#readme"
Issues = "https://github.com/saiabhiramjaini/first-domino/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/first_domino"]

[tool.hatch.build.targets.sdist]
include = ["src/first_domino", "README.md", "LICENSE", "pyproject.toml"]
